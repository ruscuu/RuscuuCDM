# Revisa el código en cada push y en cada Pull Request: sintaxis Lua, luacheck y traducciones.
name: Check

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit lua-check

      - name: Comprobar sintaxis Lua
        run: |
          for f in $(git ls-files '*.lua'); do luajit -bl "$f" > /dev/null; done

      - name: Luacheck
        run: luacheck .

      - name: Traducciones
        run: python3 tools/check_locales.py
